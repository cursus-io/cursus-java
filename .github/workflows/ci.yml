name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and Test
        run: ./gradlew build

      - name: Upload Test Results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results (Java ${{ matrix.java }})
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Spotless Check
        run: ./gradlew spotlessCheck

      - name: SpotBugs Analysis
        run: ./gradlew spotbugsMain

  saga-db-integration:
    name: Saga PostgreSQL + MySQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cursus
          POSTGRES_PASSWORD: cursus
          POSTGRES_DB: cursus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cursus -d cursus"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cursus
          MYSQL_USER: cursus
          MYSQL_PASSWORD: cursus
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CURSUS_SAGA_POSTGRES_DSN: postgresql://cursus:cursus@localhost:5432/cursus
      CURSUS_SAGA_MYSQL_DSN: mysql://cursus:cursus@localhost:3306/cursus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify transactional Saga adapters and history outbox retry
        run: ./gradlew :cursus-client:test

  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: DCO Check
        run: |
          # Check all commits in PR for Signed-off-by
          commits=$(git log --no-merges --format='%H' origin/main..HEAD)
          for sha in $commits; do
            if ! git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by:'; then
              echo "❌ Commit $sha is missing Signed-off-by line"
              echo "  Use: git commit -s"
              exit 1
            fi
          done
          echo "✅ All commits have Signed-off-by"
