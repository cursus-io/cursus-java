name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Build and Test
        run: ./gradlew build

      - name: Upload Test Results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results (Java ${{ matrix.java }})
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Spotless Check
        run: ./gradlew spotlessCheck

      - name: SpotBugs Analysis
        run: ./gradlew spotbugsMain

  event-store-e2e:
    name: Event sourcing Broker E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Cursus Broker
        uses: actions/checkout@v7
        with:
          repository: cursus-io/cursus
          # TXN_APPEND_STREAM is introduced by Core PR #209. Return to main after it merges.
          ref: feat/saga-history-v1-rebased
          path: cursus-broker
      - name: Start Cursus Broker
        working-directory: cursus-broker/test/e2e
        run: docker compose up --build --detach --wait
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify EventStore, wire-v2, and broker-native Saga through Cursus
        env:
          CURSUS_E2E: "true"
          CURSUS_E2E_BROKER: localhost:10000
        run: >-
          ./gradlew :cursus-client:test
          --tests '*CursusEventStoreBrokerE2ETest'
          --tests '*SdkWireV2E2ETest'
          --tests '*BrokerSagaRuntimeE2ETest'
      - name: Collect Broker logs
        if: always()
        working-directory: cursus-broker/test/e2e
        run: docker compose logs --no-color
      - name: Stop Cursus Broker
        if: always()
        working-directory: cursus-broker/test/e2e
        run: docker compose down --volumes --remove-orphans

  dco:
    name: DCO
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: DCO Check
        run: |
          # Check all commits in PR for Signed-off-by
          commits=$(git log --no-merges --format='%H' origin/main..HEAD)
          for sha in $commits; do
            if ! git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by:'; then
              echo "❌ Commit $sha is missing Signed-off-by line"
              echo "  Use: git commit -s"
              exit 1
            fi
          done
          echo "✅ All commits have Signed-off-by"
